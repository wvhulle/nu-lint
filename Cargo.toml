[workspace]
members = ["nu-lint-analysis", "nu-lint-rules"]
default-members = [".", "nu-lint-analysis", "nu-lint-rules"]

[workspace.package]
authors = ["Willem Vanhulle <willemvanhulle@protonmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://codeberg.org/wvhulle/nu-lint"
# Find latest published version with `cargo search nu-lint`
version = "1.6.0"

[package]
authors.workspace = true
description = "Linter for Nu shell scripts that helpfully suggests improvements"
edition.workspace = true
exclude = [
  "result",
  ".ast-grep/",
  ".helix/",
  ".woodpecker/",
  ".envrc",
  ".pre-commit-config.yaml",
  ".pre-commit-hooks.yaml",
  "Cargo.lock",
  "benches/",
  "docs/",
  "flake.lock",
  "flake.nix",
  "release-plz.toml",
  "sgconfig.yml",
]
keywords = ["nushell", "linter", "static-analysis", "code-quality", "shell"]
license.workspace = true
name = "nu-lint"
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[workspace.lints.clippy]
# https://rust-lang.github.io/rust-clippy/master/index.html
complexity = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }

absolute_paths = "warn"
allow_attributes_without_reason = "deny"
branches_sharing_code = "deny"
collapsible_else_if = "deny"
collapsible_if = "deny"
explicit_counter_loop = "deny"
explicit_iter_loop = "deny"
filter_map_next = "deny"
flat_map_identity = "deny"
get_unwrap = "deny"
if_then_some_else_none = "deny"
impl_trait_in_params = "allow"
manual_clamp = "deny"
manual_filter_map = "deny"
manual_find = "deny"
manual_map = "deny"
manual_ok_or = "deny"
missing_panics_doc = "allow"
needless_raw_string_hashes = "allow"
struct_excessive_bools = "allow"
# manual_saturating_arithmetic = "deny"
manual_unwrap_or = "deny"
manual_while_let_some = "deny"
map_err_ignore = "deny"
map_flatten = "deny"
map_unwrap_or = "deny"
match_bool = "deny"
missing_assert_message = "deny"
missing_const_for_fn = "deny"
# mod_module_files = "deny"
# module_name_repetitions = "deny"
multiple_inherent_impl = "deny"
mut_mut = "deny"
# mutex_atomic = "deny"
needless_bool = "deny"
needless_bool_assign = "deny"
needless_collect = "deny"
needless_continue = "deny"
needless_range_loop = "deny"
option_if_let_else = "allow"
option_map_or_none = "deny"
panic_in_result_fn = "deny"
redundant_clone = "deny"
redundant_closure_for_method_calls = "deny"
redundant_pub_crate = "deny"
redundant_type_annotations = "deny"
renamed_function_params = "deny"
significant_drop_tightening = "deny"
single_match_else = "deny"
single_option_map = "deny"
too_long_first_doc_paragraph = "deny"
trait_duplication_in_bounds = "deny"
trivial_regex = "deny"
type_repetition_in_bounds = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_mut_passed = "deny"
use_self = "deny"
useless_let_if_seq = "deny"
verbose_file_reads = "deny"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
criterion = { version = "0.7", features = ["html_reports", "csv_output"] }
dirs = "6"
heck = "0.5"
ignore = "0.4"
jaq-core = "2.2"
log = "0.4"
lsp-server = "0.7"
lsp-types = "0.97"
miette = { version = "7.6", features = ["fancy"] }
nu-ansi-term = "0.50"
nu-cli = "0.116.0"
nu-cmd-extra = "0.116.0"
nu-cmd-lang = "0.116.0"
nu-command = { version = "0.116.0", features = ["sqlite"] }
nu-lint-analysis = { version = "1.6.0", path = "nu-lint-analysis" }
nu-lint-rules = { version = "1.6.0", path = "nu-lint-rules" }
nu-parser = "0.116.0"
nu-protocol = "0.116.0"
nu-std = "0.116.0"
owo-colors = "4"
rayon = "1.10"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies]
clap.workspace = true
dirs.workspace = true
ignore.workspace = true
log.workspace = true
lsp-server = { workspace = true, optional = true }
lsp-types = { workspace = true, optional = true }
miette.workspace = true
nu-lint-analysis.workspace = true
nu-lint-rules.workspace = true
nu-parser.workspace = true
owo-colors.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-appender = { workspace = true, optional = true }
tracing-log.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["lsp"]
lsp = ["dep:lsp-server", "dep:lsp-types", "dep:tracing-appender"]

[dev-dependencies]
criterion.workspace = true
nu-lint-analysis = { workspace = true, features = ["test-support"] }
nu-ansi-term.workspace = true
tempfile.workspace = true

[build-dependencies]
toml.workspace = true

[[bench]]
harness = false
name = "speed"

[package.metadata.binstall]
# cargo-binstall configuration for binary releases on Codeberg
# See: https://github.com/cargo-bins/cargo-binstall
bin-dir = "nu-lint"
pkg-fmt = "tgz"
pkg-url = "{ repo }/releases/download/v{ version }/nu-lint-{ target }.tar.gz"
