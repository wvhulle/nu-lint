when:
  - repo: wvhulle/nu-lint
    event: [push, manual]
    branch: main

depends_on:
  - test

clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      depth: 0
      partial: false
      tags: true

steps:
  - name: release
    image: nixos/nix:latest
    environment:
      NIX_CONFIG: experimental-features = nix-command flakes
      CODEBERG_TOKEN:
        from_secret: codeberg_token
      CARGO_REGISTRY_TOKEN:
        from_secret: cargo_registry_token
    commands:
      - git config --global user.name "release-plz"
      - git config --global user.email "willemvanhulle@protonmail.com"
      - git remote set-url origin "https://wvhulle:$${CODEBERG_TOKEN}@codeberg.org/$${CI_REPO}.git"
      - git checkout -B main "$${CI_COMMIT_SHA}"
      - nix develop .#release -c release-plz release --forge gitea --git-token "$${CODEBERG_TOKEN}"
      - nix develop .#release -c release-plz release-pr --forge gitea --git-token "$${CODEBERG_TOKEN}"
