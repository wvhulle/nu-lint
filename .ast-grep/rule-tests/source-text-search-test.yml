id: source-text-search
valid:
  - |
    fn detect_flag(call: &Call) -> bool {
        call.has_named_flag("raw")
    }
  - |
    fn build_fix(context: &LintContext, span: Span) -> Fix {
        let text = context.span_text(span);
        Fix::new(text.to_string())
    }
  - |
    fn unrelated_search(names: &[String]) -> bool {
        names.iter().any(|name| name.starts_with("std"))
    }
  - |
    fn first_tokens(context: &LintContext, tokens: &[Token], count: usize) -> &[Token] {
        let text = context.span_text(tokens[0].span);
        log::trace!("{text}");
        &tokens[..count]
    }
  - |
    fn is_named(name: &str) -> bool {
        name == "std/log"
    }
invalid:
  - |
    fn same_operand(context: &LintContext, span: Span, expected: &str) -> bool {
        context.span_text(span) == expected
    }
  - |
    fn has_raw_flag(context: &LintContext, span: Span) -> bool {
        context.span_text(span).contains("--raw")
    }
  - |
    fn build_fix(context: &LintContext, span: Span) -> String {
        let condition = context.span_text(span);
        condition.trim().to_string()
    }
  - |
    fn find_bracket(context: &LintContext, expr: &Expression) -> Option<usize> {
        let definition = context.expr_text(expr);
        definition.find('[')
    }
  - |
    fn mentions_log(context: &LintContext) -> bool {
        context.source_contains("std/log")
    }
  - |
    fn is_log_import(context: &LintContext, expr: &Expression) -> bool {
        let text = context.expr_text(expr);
        text == "std/log"
    }
  - |
    fn is_flag(context: &LintContext, expr: &Expression) -> bool {
        context.expr_text(expr) != "-c"
    }
  - |
    fn after_param(context: &LintContext, span: Span, offset: usize) -> &str {
        let signature_text = context.span_text(span);
        &signature_text[offset..]
    }
