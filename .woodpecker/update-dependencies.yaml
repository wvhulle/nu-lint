when:
  - repo: wvhulle/nu-lint
    event: cron
    cron: weekly-dependency-update

clone:
  - name: clone-with-history
    image: woodpeckerci/plugin-git
    settings:
      depth: 0
      partial: false
      tags: true

variables:
  - &update_env
    NIX_CONFIG: |
      experimental-features = nix-command flakes
      build-users-group =
      extra-substituters = https://wvhulle.cachix.org
      extra-trusted-public-keys = wvhulle.cachix.org-1:heXx8DZMiRsKUx6l1TxNoF+Nmtmz66QEdsonQzc1ir0=
    GIT_AUTHOR_NAME: nu-lint-bot
    GIT_AUTHOR_EMAIL: willemvanhulle@protonmail.com
    GIT_COMMITTER_NAME: nu-lint-bot
    GIT_COMMITTER_EMAIL: willemvanhulle@protonmail.com
    CODEBERG_TOKEN:
      from_secret: codeberg_token

steps:
  - name: update-dependencies-pr
    image: nixos/nix:latest
    environment: *update_env
    commands:
      - nix run --quiet .#authenticate-git-origin
      - nix develop --quiet --command cargo xtask update-dependencies --open-pr
