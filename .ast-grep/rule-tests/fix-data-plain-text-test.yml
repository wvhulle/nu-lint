id: fix-data-plain-text
valid:
  - |
    struct FixData { name_span: Span, operator: &'static str }
    impl DetectFix for Unused { type FixInput<'a> = FixData; }
  - |
    struct Unrelated { name: String }
    struct FixData { name_span: Span }
    impl DetectFix for Unused { type FixInput<'a> = FixData; }
invalid:
  - |
    pub enum VariantFixData {
        WithDelimiter { span: Span, delimiter: String },
        NoFix,
    }
    impl DetectFix for VariantRule {
        type FixInput<'a> = VariantFixData;
    }
  - |
    struct FixData { var_name: String, name_span: Span }
    impl DetectFix for Unused { type FixInput<'a> = FixData; }
  - |
    struct Rewrite { remaining_params: Vec<String> }
    impl DetectFix for Unused { type FixInput<'a> = Rewrite; }
  - |
    struct FixData<'a> { variable: &'a str }
    impl DetectFix for Unused { type FixInput<'a> = FixData<'a>; }
  - |
    struct FixData { var_name: String }
    impl DetectFix for Unused { type FixInput<'a> = Option<FixData>; }
  - |
    struct FixData<'a> { variable: &'a str }
    impl DetectFix for Unused { type FixInput<'a> = Option<FixData<'a>>; }
