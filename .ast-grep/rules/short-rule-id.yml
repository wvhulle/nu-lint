# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

id: short-rule-id
message: IDs of rules should be just a few keywords long
severity: error
language: Rust
ignores:
  - nu-lint-rules/src/default_empty_string_masks_missing/**
rule:
    kind: string_literal
    inside:
      kind: block
      inside:
        kind: function_item
        pattern: fn id
    has:
      kind: string_content
      not:
        regex: ^.{10,30}$
note: Rule ids are configuration keys, so renaming the ignored rule would break user configs.
