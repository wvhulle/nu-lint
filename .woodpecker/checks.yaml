when:
  - repo: wvhulle/nu-lint
    event: [pull_request, push, manual]

variables:
  - &nix_config
    NIX_CONFIG: |
      experimental-features = nix-command flakes
      build-users-group =
      extra-substituters = https://wvhulle.cachix.org
      extra-trusted-public-keys = wvhulle.cachix.org-1:heXx8DZMiRsKUx6l1TxNoF+Nmtmz66QEdsonQzc1ir0=
  - &on_trusted_events
    - event: [push, manual]
  - &on_pull_requests
    - event: pull_request

steps:
  - name: cargo-test
    image: nixos/nix:latest
    depends_on: []
    when: *on_trusted_events
    environment: *nix_config
    commands:
      - nix run .#build-and-export-paths -- .#checks.x86_64-linux.tests

  - name: upload-cargo-test-cache
    image: nixos/nix:latest
    depends_on: [cargo-test]
    when:
      - event: [push, manual]
        status: [success, failure]
    environment:
      <<: *nix_config
      CACHIX_AUTH_TOKEN:
        from_secret: cachix_auth_token
    commands:
      - nix run .#upload-exported-paths

  - name: cargo-test-pr
    image: nixos/nix:latest
    depends_on: []
    when: *on_pull_requests
    environment: *nix_config
    commands:
      - nix build --print-build-logs .#checks.x86_64-linux.tests

  - name: rustfmt
    image: nixos/nix:latest
    depends_on: []
    environment: *nix_config
    commands:
      - nix build .#checks.x86_64-linux.fmt --print-build-logs

  - name: ast-grep
    image: nixos/nix:latest
    depends_on: []
    environment: *nix_config
    commands:
      - nix build .#checks.x86_64-linux.ast-grep --print-build-logs

  - name: conventional-commits
    image: nixos/nix:latest
    depends_on: []
    when: *on_pull_requests
    environment: *nix_config
    commands:
      - git fetch --quiet origin "$${CI_COMMIT_TARGET_BRANCH}"
      - nix run .#check-commits -- FETCH_HEAD..HEAD
