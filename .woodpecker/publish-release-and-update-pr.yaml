when:
  - repo: wvhulle/nu-lint
    event: [push, manual]
    branch: main

depends_on:
  - checks

clone:
  - name: clone-with-history
    image: woodpeckerci/plugin-git
    settings:
      depth: 0
      partial: false
      tags: true

variables:
  - &release_env
    NIX_CONFIG: |
      experimental-features = nix-command flakes
      build-users-group =
      extra-substituters = https://wvhulle.cachix.org
      extra-trusted-public-keys = wvhulle.cachix.org-1:heXx8DZMiRsKUx6l1TxNoF+Nmtmz66QEdsonQzc1ir0=
    GIT_AUTHOR_NAME: release-plz
    GIT_AUTHOR_EMAIL: willemvanhulle@protonmail.com
    GIT_COMMITTER_NAME: release-plz
    GIT_COMMITTER_EMAIL: willemvanhulle@protonmail.com
    CODEBERG_TOKEN:
      from_secret: bot_token
    CARGO_REGISTRY_TOKEN:
      from_secret: cargo_registry_token

steps:
  - name: publish-unreleased-crate-version
    image: nixos/nix:latest
    environment: *release_env
    commands:
      - nix run --quiet .#publish-unreleased-crate-version

  - name: open-or-update-release-pr
    image: nixos/nix:latest
    environment: *release_env
    commands:
      - nix run --quiet .#open-or-update-release-pr
