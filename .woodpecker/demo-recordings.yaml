when:
  - repo: wvhulle/nu-lint
    event: push
    branch: main
    path:
      include:
        - src/**
        - nu-lint-analysis/**
        - nu-lint-rules/**
        - xtask/**
        - demos/**
        - build.rs
        - Cargo.toml
        - Cargo.lock
        - flake.nix
        - flake.lock
  - repo: wvhulle/nu-lint
    event: manual
    branch: main

depends_on:
  - checks

variables:
  - &nix_config
    NIX_CONFIG: |
      experimental-features = nix-command flakes
      build-users-group =
      sandbox = false
      extra-substituters = https://wvhulle.cachix.org
      extra-trusted-public-keys = wvhulle.cachix.org-1:heXx8DZMiRsKUx6l1TxNoF+Nmtmz66QEdsonQzc1ir0=

steps:
  - name: record-and-push-demo-recordings
    image: nixos/nix:latest
    environment:
      <<: *nix_config
      JJ_USER: nu-lint-bot
      JJ_EMAIL: willemvanhulle@protonmail.com
      CODEBERG_TOKEN:
        from_secret: bot_token
    commands:
      - nix run --quiet .#build-and-export-paths -- .#recordings --max-jobs 1
      - nix run --quiet .#publish-recordings -- result "https://wvhulle-bot:$${CODEBERG_TOKEN}@codeberg.org/$${CI_REPO}.git"

  - name: upload-demo-recordings-to-cachix
    image: nixos/nix:latest
    when:
      - status: [success, failure]
    environment:
      <<: *nix_config
      CACHIX_AUTH_TOKEN:
        from_secret: cachix_auth_token
    commands:
      - nix run --quiet .#upload-exported-paths
