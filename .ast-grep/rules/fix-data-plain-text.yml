# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

id: fix-data-plain-text
message: Fix data should hold semantic data such as spans, not plain text. Read source text from a span when building the fix.
severity: error
language: Rust
files:
  - nu-lint-rules/src/**
ignores:
  - nu-lint-rules/src/external_tools/date_to_builtin/mod.rs
  - nu-lint-rules/src/glob_may_drop_quotes/mod.rs
  - nu-lint-rules/src/if_else_chain_to_match/mod.rs
  - nu-lint-rules/src/migrations/ignore_errors_to_optional/mod.rs
  - nu-lint-rules/src/parsing/lines_each_to_parse/mod.rs
  - nu-lint-rules/src/parsing/simplify_regex_parse/mod.rs
  - nu-lint-rules/src/parsing/split_first_to_parse/mod.rs
  - nu-lint-rules/src/parsing/split_row_get_multistatement/mod.rs
  - nu-lint-rules/src/string_may_be_bare/mod.rs
  - nu-lint-rules/src/transpose_items/mod.rs
rule:
  kind: field_declaration
  has:
    field: type
    regex: \bString\b|\bstr\b
    not:
      regex: "'static"
  any:
    - inside:
        stopBy: end
        kind: struct_item
        has:
          field: name
          pattern: $FIX_STRUCT
        inside:
          kind: source_file
          has:
            stopBy: end
            pattern:
              context: "impl X for Y { type FixInput<'a> = $FIX_STRUCT; }"
              selector: type_item
    - inside:
        stopBy: end
        kind: struct_item
        has:
          field: name
          pattern: $FIX_STRUCT
        inside:
          kind: source_file
          has:
            stopBy: end
            pattern:
              context: "impl X for Y { type FixInput<'a> = $FIX_STRUCT<'a>; }"
              selector: type_item
note: See CONTRIBUTING.md, section Implementing auto-fix.
