id: variable-identity-by-name
valid:
  - |
    fn same_variable(first: &Expression, second: &Expression) -> bool {
        first.root_var_id() == second.root_var_id()
    }
  - |
    fn display_name(var_id: VarId, context: &LintContext) -> Option<String> {
        variable_name(var_id, context)
    }
invalid:
  - |
    fn same_name(first: VarId, second: VarId, context: &LintContext) -> bool {
        variable_name(first, context) == variable_name(second, context)
    }
  - |
    fn is_named(var_id: VarId, wanted: &str, context: &LintContext) -> bool {
        variable_name(var_id, context).as_deref() == Some(wanted)
    }
  - |
    fn is_named(var_id: VarId, wanted: &str, context: &LintContext) -> bool {
        variable_name(var_id, context).is_some_and(|name| name == wanted)
    }
