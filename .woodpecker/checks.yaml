when:
  - repo: wvhulle/nu-lint
    event: [pull_request, push, manual]

variables:
  - &nix_config
    NIX_CONFIG: |
      experimental-features = nix-command flakes
      build-users-group =
      extra-substituters = https://wvhulle.cachix.org
      extra-trusted-public-keys = wvhulle.cachix.org-1:heXx8DZMiRsKUx6l1TxNoF+Nmtmz66QEdsonQzc1ir0=
  - &on_pull_requests
    - event: pull_request

steps:
  - name: build-test-dependencies
    image: nixos/nix:latest
    depends_on: []
    environment: *nix_config
    commands:
      - nix run --quiet .#build-unless-cached -- .#packages.x86_64-linux.test-dependencies

  - name: cargo-test
    image: nixos/nix:latest
    depends_on: [build-test-dependencies]
    when:
      - status: [success, failure]
    environment: *nix_config
    commands:
      - nix run --quiet .#import-exported-paths
      - nix run --quiet .#build-and-export-paths -- .#checks.x86_64-linux.tests

  - name: upload-cargo-test-cache
    image: nixos/nix:latest
    depends_on: [cargo-test]
    when:
      - event: [push, manual]
        status: [success, failure]
    environment:
      <<: *nix_config
      CACHIX_AUTH_TOKEN:
        from_secret: cachix_auth_token
    commands:
      - nix run --quiet .#upload-exported-paths

  - name: pre-commit-hooks
    image: nixos/nix:latest
    depends_on: []
    environment: *nix_config
    commands:
      - nix run --quiet .#run-pre-commit-hooks

  - name: ci-task-tests
    image: nixos/nix:latest
    depends_on: []
    environment: *nix_config
    commands:
      - nix build --quiet --print-build-logs .#checks.x86_64-linux.ci-task-tests

  - name: conventional-commits
    image: nixos/nix:latest
    depends_on: []
    when: *on_pull_requests
    environment: *nix_config
    commands:
      - nix run --quiet .#check-commits -- --fetch-target-branch FETCH_HEAD..HEAD
