when:
  - repo: wvhulle/nu-lint
    event: release

variables:
  - &nix_config
    NIX_CONFIG: |
      experimental-features = nix-command flakes
      extra-substituters = https://wvhulle.cachix.org
      extra-trusted-public-keys = wvhulle.cachix.org-1:heXx8DZMiRsKUx6l1TxNoF+Nmtmz66QEdsonQzc1ir0=

steps:
  - name: build-musl-tarballs
    image: nixos/nix:latest
    environment:
      <<: *nix_config
      CACHIX_AUTH_TOKEN:
        from_secret: cachix_auth_token
    commands:
      - nix run .#cached-build -- .#dist
      - mkdir -p dist
      - cp result/* dist/

  - name: attach-to-codeberg-release
    image: nixos/nix:latest
    environment:
      <<: *nix_config
      CODEBERG_TOKEN:
        from_secret: codeberg_token
    commands:
      - nix run .#upload-release-assets -- dist
