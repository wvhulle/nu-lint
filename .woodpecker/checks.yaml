when:
  - repo: wvhulle/nu-lint
    event: [pull_request, push, manual]

variables:
  - &nix_config
    NIX_CONFIG: |
      experimental-features = nix-command flakes
      build-users-group =
      extra-substituters = https://wvhulle.cachix.org
      extra-trusted-public-keys = wvhulle.cachix.org-1:heXx8DZMiRsKUx6l1TxNoF+Nmtmz66QEdsonQzc1ir0=
  - &on_pull_requests
    - event: pull_request

steps:
  - name: flake-checks
    image: nixos/nix:latest
    depends_on: []
    when:
      - event: [push, manual]
    environment:
      <<: *nix_config
      CACHIX_AUTH_TOKEN:
        from_secret: cachix_auth_token
    commands:
      - nix shell --quiet --inputs-from . nixpkgs#cachix nixpkgs#nix-fast-build --command nix-fast-build --no-nom --skip-cached --cachix-cache wvhulle --push-build-closure --flake .#checks.x86_64-linux

  - name: flake-checks-pr
    image: nixos/nix:latest
    depends_on: []
    when: *on_pull_requests
    environment: *nix_config
    commands:
      - nix shell --quiet --inputs-from . nixpkgs#cachix nixpkgs#nix-fast-build --command nix-fast-build --no-nom --skip-cached --flake .#checks.x86_64-linux

  - name: conventional-commits
    image: nixos/nix:latest
    depends_on: []
    when: *on_pull_requests
    environment: *nix_config
    commands:
      - git fetch --quiet origin "$${CI_COMMIT_TARGET_BRANCH}"
      - nix run --quiet .#check-commits -- FETCH_HEAD..HEAD
