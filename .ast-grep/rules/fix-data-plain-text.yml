# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

id: fix-data-plain-text
message: Fix data should hold semantic data such as spans, not plain text. Read source text from a span when building the fix.
severity: error
language: Rust
files:
  - nu-lint-rules/src/**
rule:
  kind: field_declaration
  has:
    field: type
    regex: \bString\b|\bstr\b
    not:
      regex: "'static"
  any:
    - inside:
        stopBy: end
        kind: struct_item
        has:
          field: name
          pattern: $FIX_STRUCT
        inside:
          kind: source_file
          has:
            stopBy: end
            pattern:
              context: "impl X for Y { type FixInput<'a> = $FIX_STRUCT; }"
              selector: type_item
    - inside:
        stopBy: end
        kind: struct_item
        has:
          field: name
          pattern: $FIX_STRUCT
        inside:
          kind: source_file
          has:
            stopBy: end
            pattern:
              context: "impl X for Y { type FixInput<'a> = $FIX_STRUCT<'a>; }"
              selector: type_item
    - inside:
        stopBy: end
        kind: struct_item
        has:
          field: name
          pattern: $FIX_STRUCT
        inside:
          kind: source_file
          has:
            stopBy: end
            pattern:
              context: "impl X for Y { type FixInput<'a> = Option<$FIX_STRUCT>; }"
              selector: type_item
    - inside:
        stopBy: end
        kind: struct_item
        has:
          field: name
          pattern: $FIX_STRUCT
        inside:
          kind: source_file
          has:
            stopBy: end
            pattern:
              context: "impl X for Y { type FixInput<'a> = Option<$FIX_STRUCT<'a>>; }"
              selector: type_item
note: See CONTRIBUTING.md, section Implementing auto-fix.
