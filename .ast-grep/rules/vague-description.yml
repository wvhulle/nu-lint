# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

id: vague-description
message: Rule descriptions should be straightforward. Do not use vague or redundant words such as "prefer" or "Nushell" (version facts like "Nushell 0.116.0" are fine).

severity: warning # error, warning, info, hint
language: Rust
rule:
  kind: string_literal
  inside:
    stopBy:
      kind: function_item
    any:
      - pattern: fn short_description
      - pattern: fn long_description
  has:
    kind: string_content
    any:
      - regex: (?i)prefer
      - all:
          - regex: Nushell|Nu's|Nu\s
          - not:
              regex: Nushell \d
