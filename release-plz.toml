[workspace]
semver_check = false
publish_no_verify = true
git_release_type = "prod"
release_commits = "^(feat|fix|perf)[(:!]"
pr_labels = ["release"]
git_release_body = """
{{ changelog }}

## Downloads

| File | Platform |
|------|----------|
| `nu-lint-x86_64-unknown-linux-musl.tar.gz` | Linux x86_64 (Ubuntu, Debian, Fedora, etc.) |
| `nu-lint-aarch64-unknown-linux-musl.tar.gz` | Linux ARM64 (Raspberry Pi, AWS Graviton) |

See [README](https://codeberg.org/wvhulle/nu-lint#installation) for full installation instructions.
"""

[[package]]
name = "nu-lint"
changelog_path = "CHANGELOG.md"
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
version_group = "nu-lint"
changelog_include = ["nu-lint-analysis"]

[[package]]
name = "nu-lint-analysis"
changelog_update = false
git_tag_enable = false
git_release_enable = false
version_group = "nu-lint"

[changelog]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^style", group = "Changed" },
  { message = "^test", group = "Testing" },
  { message = "^chore: release", skip = true },
  { message = "^chore", group = "Miscellaneous" },
  { message = "^ci", group = "CI" },
  { message = "^build", group = "Build" },
  { message = "^[Mm]erge", skip = true },
  { message = ".*", group = "Other" },
]
